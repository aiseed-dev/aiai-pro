# Stalwart mail server for aiai tools, ports as in the official Docker page.
# Mail ports are published directly (the container must be reachable from
# outside); the admin UI on 8080 is bound to 127.0.0.1 and published by
# Caddy. Sample only: has not been run yet (2026-09-28).

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
      - "127.0.0.1:8080:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

volumes:
  stalwart-etc:
  stalwart-data:
