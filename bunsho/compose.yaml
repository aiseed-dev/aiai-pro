# ONLYOFFICE Docs Community Edition for aiai tools. Published by Caddy as
# docs.example.jp. Set JWT_SECRET in .env; without it the secret changes
# on every restart and integrations break.
# Sample only: has not been run yet (2026-09-28).

services:
  onlyoffice:
    image: onlyoffice/documentserver:9.4
    restart: always
    environment:
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./oo_data:/var/www/onlyoffice/Data
      - ./oo_logs:/var/log/onlyoffice
